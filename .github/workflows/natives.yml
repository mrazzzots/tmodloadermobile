name: natives

on:
  push:
    paths: ['native/**', '.github/workflows/natives.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/natives.yml']
  workflow_dispatch:
  workflow_call:

jobs:
  android:
    name: android-${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]   # x86_64 only for the CI emulator
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache sources
        uses: actions/cache@v4
        with:
          path: native/src
          key: natives-src-${{ hashFiles('native/build-android-natives.sh') }}

      - name: Build SDL2, FNA3D, FAudio, Theorafile, gcc_s shim, libmain
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          ABI=${{ matrix.abi }} ./native/build-android-natives.sh

      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.abi }}
          path: native/out/${{ matrix.abi }}/*.so
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.abi == 'arm64-v8a'
        with:
          name: sdl2-java
          path: native/out/java/
          if-no-files-found: error
